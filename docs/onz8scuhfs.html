  const NOEGLE = 'io-laas:' + D.salt;

  async function udled(kode) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fra64(D.salt), iterations: D.runder, hash: 'SHA-256' }, k, 256));
  }

  async function aabn(raa, husk) {
    const k = await crypto.subtle.importKey('raw', raa, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fra64(D.iv) }, k, fra64(D.data)));

    document.open(); document.write(html); document.close();

  // Husket nøgle (ikke kodeordet) ligger kun i denne browser og virker kun til netop denne fil
  const husket = localStorage.getItem(NOEGLE);
  if (husket) aabn(fra64(husket)).catch(() => localStorage.removeItem(NOEGLE));

  document.getElementById('laas').addEventListener('submit', async e => {

      const husk = document.getElementById('husk').checked;
      await aabn(raa, husk);
